name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Install docs dependencies
        run: uv sync --extra docs --python 3.12

      - name: Build docs
        run: uv run mkdocs build --strict --site-dir site/docs

      - name: Build use cases
        run: uv run mkdocs build --strict -f mkdocs.usecases.yml --site-dir site/usecases

      - name: Add product website
        run: |
          cp index.html site/index.html
          cp site.css site/site.css
          cp site.js site/site.js
          cp og.png site/og.png
          touch site/.nojekyll

      - name: Check site layout
        run: |
          for f in site/index.html site/site.css site/site.js site/og.png \
                   site/docs/index.html site/usecases/index.html site/.nojekyll; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
          if grep -nE '(href|src)="/[^/]' site/index.html; then
            echo "product page must use relative links"; exit 1
          fi

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
